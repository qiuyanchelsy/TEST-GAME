<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>成語填字｜國語遊戲</title>
  <style>
    :root{--ink:#372b20;--paper:#fff8e7;--red:#b84432;--jade:#466f63;--gold:#c89447}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:#efe2c5 url('assets/images/study-bg.png') center/cover fixed;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:rgba(255,249,231,.56);pointer-events:none}.game{position:relative;max-width:880px;min-height:100vh;margin:auto;padding:20px 16px 38px;text-align:center}.title{display:block;width:min(590px,94%);margin:0 auto -12px;filter:drop-shadow(0 4px 3px #5b422c55)}.status{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:690px;margin:auto;padding:10px 20px;border:2px solid #b18a57;border-radius:30px;background:#fff7e6d9;font-weight:700}.progress{height:10px;width:45%;border-radius:20px;background:#e5d4b4;overflow:hidden}.progress i{display:block;height:100%;background:var(--jade);transition:.4s}.card{position:relative;max-width:690px;margin:18px auto;padding:28px 26px 25px;background:var(--paper);border:2px solid #c6a36f;border-radius:10px;box-shadow:0 9px 0 #8e68413d,0 12px 22px #35261533;background-image:linear-gradient(#fffdf5dd,#fff5dcdd),url('assets/images/study-bg.png');background-size:auto,850px;background-position:center}.card:after{content:"";position:absolute;inset:9px;border:1px dashed #c9a875;pointer-events:none}.prompt{position:relative;z-index:1;font-size:clamp(1rem,3vw,1.25rem);font-weight:700;color:#725333}.idiom{position:relative;z-index:1;display:flex;justify-content:center;align-items:center;gap:clamp(8px,3vw,20px);margin:24px 0 20px;font-family:KaiTi,"DFKai-SB",serif;font-size:clamp(2.2rem,9vw,4rem);font-weight:bold}.fixed{padding:0 3px}.slot{position:relative;display:inline-grid;place-items:center;width:1.24em;height:1.24em;border:2px solid #9a7346;border-radius:3px;color:#47301e;background-color:#fffdf3;background-image:linear-gradient(45deg,transparent 49%,#d8bf964d 50%,transparent 51%),linear-gradient(-45deg,transparent 49%,#d8bf964d 50%,transparent 51%);transition:.25s}.slot.over{background-color:#f4e2b9;transform:scale(1.06)}.slot.wrong{animation:shake .35s;border-color:#b84432}.slot.correct{border-color:#527968;background:#e8f1df}.stamp{position:absolute;inset:-10px;display:none;place-items:center;border:5px double var(--red);border-radius:50%;color:var(--red);font:700 17px KaiTi,"DFKai-SB",serif;transform:rotate(-15deg);background:#fff4;opacity:.86}.slot.correct .stamp{display:grid;animation:stamp .35s both}.hint{position:relative;z-index:1;min-height:28px;margin:5px 0 13px;color:#875830;font-weight:700}.hint.error{color:#b84432}.word-bank{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;min-height:75px;padding:10px}.tile{width:62px;height:62px;border:0;border-radius:8px;background:#fffdf5;color:#3c2e20;font:700 33px KaiTi,"DFKai-SB",serif;box-shadow:2px 3px 0 #a67d4d,0 4px 8px #56391c2b;cursor:grab;touch-action:none;transition:.18s}.tile:hover,.tile:focus{transform:translateY(-3px) rotate(-2deg);outline:3px solid #d8b776}.tile.used{visibility:hidden}.tile.dragging{opacity:.35}.decor{position:absolute;z-index:2;pointer-events:none;width:230px;opacity:.95}.decor.left{left:-90px;bottom:15px}.decor.right{right:-105px;top:255px;transform:scaleX(-1)}.explain{position:relative;z-index:3;display:none;margin-top:16px;padding:18px 20px;border-radius:8px;background:#ecf1df;border-left:7px solid var(--jade);text-align:left;line-height:1.7;font-size:1.05rem}.explain.show{display:block}.full{font-family:KaiTi,"DFKai-SB",serif;font-weight:900;font-size:1.4rem;color:#234f45}.next,.restart{position:relative;z-index:3;margin:17px auto 0;padding:12px 28px;border:0;border-radius:30px;background:var(--red);color:white;font:700 1.1rem "Microsoft JhengHei";box-shadow:0 4px 0 #7b2b24;cursor:pointer}.next:hover,.restart:hover{filter:brightness(1.08)}.next:active,.restart:active{transform:translateY(3px);box-shadow:0 1px 0 #7b2b24}.result{display:none;position:relative;z-index:4;max-width:620px;margin:22px auto;padding:32px 25px;background:#fff9ea;border:2px solid #b18a57;border-radius:12px;box-shadow:0 8px 18px #3e2d1e33}.result.show{display:block}.result h2{margin:0;color:#9b382d;font-family:KaiTi,"DFKai-SB",serif;font-size:2rem}.score{font-size:1.35rem;line-height:1.8}.small{font-size:.93rem;color:#6d5944}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes stamp{0%{transform:scale(2.8) rotate(-15deg);opacity:0}100%{transform:scale(1) rotate(-15deg);opacity:.86}}@media(max-width:650px){.game{padding:10px 11px 28px}.title{width:100%;margin-bottom:-5px}.status{font-size:.9rem;padding:9px 13px}.progress{width:34%}.card{padding:22px 13px}.decor{width:130px;opacity:.55}.decor.left{left:-49px;bottom:38px}.decor.right{right:-53px;top:245px}.tile{width:58px;height:58px}.idiom{gap:8px;margin:20px 0}.explain{font-size:.96rem}}
  </style>
</head>
<body>
  <a href="../大冒險地圖/index.html" style="position:fixed;z-index:10;top:12px;left:12px;padding:8px 13px;border:2px solid #8f5a32;border-radius:999px;background:#fff7df;color:#5a3724;font:700 .9rem 'Microsoft JhengHei';box-shadow:0 2px 5px #4e2a1d55;text-decoration:none">← 回到大地圖</a>
  <main class="game">
    <img class="title" src="assets/images/title-plaque.png" alt="成語填字" />
    <div class="status"><span id="counter">第 1／5 題</span><div class="progress" aria-label="作答進度"><i id="bar"></i></div><span id="scoreTop">答對 0 題</span></div>
    <img class="decor left" src="assets/images/study-decorations.png" alt="筆墨紙硯裝飾" />
    <img class="decor right" src="assets/images/study-decorations.png" alt="筆墨紙硯裝飾" />
    <section class="card" id="gameCard">
      <div class="prompt">把正確的字卡放進米字格，完成成語！</div>
      <div class="idiom" id="idiom" aria-label="成語填空"></div>
      <div id="hint" class="hint" aria-live="polite">提示：可拖曳字卡，也可以先點字卡再點空格。</div>
      <div class="word-bank" id="wordBank" aria-label="字卡區"></div>
      <div class="explain" id="explain"></div>
      <button class="next" id="next" hidden>下一題 →</button>
    </section>
    <section class="result" id="result"></section>
  </main>
<script>
const idioms=[
 ['一鳴驚人',[1,3],'比喻平時沒有突出表現，一做事就有驚人的成績。'],['千變萬化',[1,3],'形容變化非常多，沒有固定的樣子。'],['畫龍點睛',[1,3],'比喻在關鍵處加上精采的一筆，使內容更生動。'],['井然有序',[1,3],'形容整齊而有條理。'],['守株待兔',[1,3],'比喻不知變通，只想靠運氣得到收穫。'],['自相矛盾',[1,3],'比喻言行前後不一致，互相衝突。'],['專心致志',[1,3],'把心思全部放在一件事上，非常專注。'],['目不轉睛',[1,3],'眼睛盯著看，形容注意力很集中。'],['見義勇為',[1,3],'看到合乎正義的事，就勇敢去做。'],['水落石出',[1,3],'比喻事情真相完全顯露出來。'],['雪中送炭',[1,3],'在別人急需時給予幫助。'],['異想天開',[1,3],'形容想法奇特，和一般人不同。'],['腳踏實地',[1,3],'做事踏實認真，不浮誇。'],['同心協力',[1,3],'大家同心合作，一起努力。'],['半信半疑',[1,3],'有些相信，又有些懷疑。'],['東張西望',[1,3],'到處看，不專心。'],['不勞而獲',[1,3],'自己不付出勞力，卻得到成果。'],['津津有味',[1,3],'形容吃得很有味道，或對事情很感興趣。'],['煥然一新',[1,3],'形容改變後呈現明亮、嶄新的樣子。'],['舉一反三',[1,3],'懂得一個道理後，能推想到其他相關的事。']
].map(([text,blanks,meaning])=>({text,blanks,meaning}));
let questions=[],index=0,score=0,selected=null,complete=false;
const $=s=>document.querySelector(s),shuffle=a=>[...a].sort(()=>Math.random()-.5);
function start(){questions=shuffle(idioms).slice(0,5);index=0;score=0;$('#result').classList.remove('show');$('#gameCard').style.display='block';render();}
function render(){complete=false;selected=null;let q=questions[index], chars=[...q.text], blanks=q.blanks;$('#counter').textContent=`第 ${index+1}／5 題`;$('#scoreTop').textContent=`答對 ${score} 題`;$('#bar').style.width=`${index/5*100}%`;$('#hint').className='hint';$('#hint').textContent='提示：可拖曳字卡，也可以先點字卡再點空格。';$('#explain').className='explain';$('#next').hidden=true;
 $('#idiom').innerHTML=chars.map((c,i)=>blanks.includes(i)?`<button class="slot" data-pos="${i}" aria-label="第${blanks.indexOf(i)+1}個空格"><span class="stamp">答對</span></button>`:`<span class="fixed">${c}</span>`).join('');
 let answers=blanks.map(i=>chars[i]), distractors=shuffle(['風','月','山','海','光','明','日','心','手','足','鳥','花'].filter(c=>!answers.includes(c))).slice(0,3);$('#wordBank').innerHTML=shuffle([...answers,...distractors]).map(c=>`<button class="tile" draggable="true" data-char="${c}" aria-label="字卡${c}">${c}</button>`).join('');bind();}
function bind(){document.querySelectorAll('.tile').forEach(t=>{t.addEventListener('dragstart',e=>{e.dataTransfer.setData('text',t.dataset.char);t.classList.add('dragging')});t.addEventListener('dragend',()=>t.classList.remove('dragging'));t.addEventListener('click',()=>{if(complete||t.classList.contains('used'))return;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));selected=t;t.classList.add('selected');$('#hint').textContent=`已選「${t.dataset.char}」，請點選一個米字格。`});});document.querySelectorAll('.slot').forEach(s=>{s.addEventListener('dragover',e=>{e.preventDefault();s.classList.add('over')});s.addEventListener('dragleave',()=>s.classList.remove('over'));s.addEventListener('drop',e=>{e.preventDefault();s.classList.remove('over');place(e.dataTransfer.getData('text'),s)});s.addEventListener('click',()=>{if(selected)place(selected.dataset.char,s)});});}
function place(char,slot){if(complete||slot.textContent.trim())return;let q=questions[index], correct=q.text[+slot.dataset.pos];if(char!==correct){slot.classList.add('wrong');$('#hint').className='hint error';$('#hint').textContent=`「${char}」不在這個位置，再想想看！`;setTimeout(()=>slot.classList.remove('wrong'),400);selected=null;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));return}slot.insertBefore(document.createTextNode(char),slot.firstChild);slot.classList.add('correct');let tile=[...document.querySelectorAll('.tile')].find(t=>t.dataset.char===char&&!t.classList.contains('used'));if(tile)tile.classList.add('used');selected=null;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));if(document.querySelectorAll('.slot.correct').length===2)finish();else {$('#hint').className='hint';$('#hint').textContent='很好！再完成另一個米字格。'}}
function finish(){complete=true;score++;let q=questions[index];$('#scoreTop').textContent=`答對 ${score} 題`;$('#bar').style.width=`${(index+1)/5*100}%`;$('#hint').textContent='太棒了！兩個字都填對了。';$('#explain').innerHTML=`<span class="full">${q.text}</span><br>${q.meaning}`;$('#explain').classList.add('show');$('#next').hidden=false;}
$('#next').addEventListener('click',()=>{index++;if(index<5)render();else showResult();});
function showResult(){localStorage.setItem('cert_idiom','true');$('#gameCard').style.display='none';let msg=score===5?'你是成語小狀元！':score>=3?'表現很棒，再挑戰一次會更熟練！':'完成挑戰就是進步，重玩一次試試看！';$('#result').innerHTML=`<h2>闖關完成！</h2><p class="score">你答對了 <strong>${score}</strong>／5 題<br>${msg}</p><p class="small">每次開始都會從 20 題成語中隨機抽出 5 題。</p><button class="restart" onclick="start()">重新開始</button>`;$('#result').classList.add('show');}
start();
// 覆寫填字判定：印章文字本身不算已填字。
function place(char,slot){
  if(complete||slot.classList.contains('correct'))return;
  let q=questions[index],correct=q.text[+slot.dataset.pos];
  if(char!==correct){slot.classList.add('wrong');$('#hint').className='hint error';$('#hint').textContent=`「${char}」不在這個位置，再想想看！`;setTimeout(()=>slot.classList.remove('wrong'),400);selected=null;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));return;}
  slot.insertBefore(document.createTextNode(char),slot.firstChild);slot.classList.add('correct');
  let tile=[...document.querySelectorAll('.tile')].find(t=>t.dataset.char===char&&!t.classList.contains('used'));if(tile)tile.classList.add('used');selected=null;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));
  if(document.querySelectorAll('.slot.correct').length===2)finish();else{$('#hint').className='hint';$('#hint').textContent='很好！再完成另一個米字格。'}
}
</script>
</body></html>
