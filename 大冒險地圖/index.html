<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方塊三印大冒險</title>
<style>
*{box-sizing:border-box}:root{--paper:#fff9e8;--green:#249256}body{margin:0;min-height:100vh;background:#071526;color:#3e3529;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;overflow:hidden}button{font:inherit;cursor:pointer}.cover{position:fixed;z-index:50;inset:0;display:grid;place-items:center;background:#04111f;cursor:pointer;transition:opacity .65s}.cover.hide{opacity:0;pointer-events:none}.cover img{width:100%;height:100%;object-fit:contain}.app{display:none;min-height:100vh;padding:16px;place-items:center;background:radial-gradient(circle,#164064,#071526)}.app.show{display:grid}.map-wrap{position:relative;width:min(100%,177.78vh);max-height:calc(100vh - 32px);aspect-ratio:16/9;margin:auto}.map-wrap>img{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;box-shadow:0 10px 34px #0009}.info{position:absolute;z-index:3;top:1.8%;right:1.4%;display:flex;align-items:center;gap:8px;padding:7px 10px;border:2px solid #f5c75c;border-radius:12px;background:#07172bdf;color:#fff4bd;font-weight:900;box-shadow:0 3px 8px #0008}.clear{border:1px solid #f4ce75;border-radius:8px;padding:5px 8px;background:#fff9dd;color:#594124;font-weight:900}.hotspot{position:absolute;z-index:2;border:0;border-radius:16px;background:transparent;transition:.18s;outline:none}.hotspot:hover,.hotspot:focus-visible{background:#fffbd840;box-shadow:0 0 0 3px #fff5a2,0 0 22px 7px #fff3a080}.hotspot.done:after{content:'✓';position:absolute;right:4%;top:4%;display:grid;place-items:center;width:34px;height:34px;border:3px solid white;border-radius:50%;background:var(--green);color:white;font-size:1.55rem;font-weight:900;transform:rotate(-12deg);box-shadow:0 2px 5px #0008}.dynasty{left:5%;top:8%;width:27%;height:39%}.idiom{left:70%;top:8%;width:26%;height:39%}.warrior{left:68%;top:48%;width:29%;height:48%}.gate-hotspot{left:32%;top:18%;width:36%;height:68%}.modal{position:fixed;z-index:20;inset:0;display:none;place-items:center;padding:18px;background:#071323b8}.modal.show{display:grid}.dialog{width:min(800px,100%);max-height:92vh;overflow:auto;padding:25px;border:5px solid #ac763d;border-radius:27px;background:var(--paper);box-shadow:0 14px 45px #0008}.dialog h2{text-align:center;margin:0;color:#7f452a}.close{float:right;border:0;background:none;font-size:1.6rem}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0 25px}.slot{min-height:132px;padding:9px;border:3px dashed #aa8a63;border-radius:17px;background:#efe4cc;text-align:center;font-weight:900}.slot small{display:block;margin-bottom:10px;color:#74583b}.slot.over{background:#e6f4d9;border-color:#4d9a65}.slot.correct{border-style:solid;border-color:#39845a;background:#e2f5d9}.slot.wrong{animation:flash .45s;background:#ffe0dc;border-color:#bf4039}@keyframes flash{50%{transform:translateX(7px)}}.bag{min-height:108px;padding:12px;border:3px solid #b78c55;border-radius:18px;background:#fffdf4}.bag h3{margin:0 0 8px;font-size:1rem}.badges{display:flex;gap:11px;flex-wrap:wrap}.badge{display:flex;align-items:center;gap:7px;padding:8px 11px;border:2px solid #98713e;border-radius:12px;background:#fff1b8;font-weight:900;cursor:grab;user-select:none;touch-action:none}.complete{text-align:center}.complete h2{font-size:2.2rem;color:#a54830}.again{border:0;border-radius:99px;padding:12px 24px;background:#34825c;color:white;font-weight:900;font-size:1.1rem}@media(max-width:700px){body{overflow:auto}.app{padding:0;align-items:center}.map-wrap{width:100%;max-height:none}.info{font-size:.78rem;padding:4px}.clear{padding:3px 5px}.hotspot.done:after{width:25px;height:25px;font-size:1.1rem;border-width:2px}.dialog{padding:18px}.slots{grid-template-columns:1fr}.slot{min-height:88px}}
</style></head><body>
<div class="cover" id="cover" aria-label="點擊開始遊戲"><img src="cover.png" alt="方塊三印大冒險：點擊任何部位遊戲開始"></div>
<main class="app" id="app"><div class="map-wrap"><img src="map-bg.png" alt="方塊三印大冒險地圖"><section class="info">持有 <span id="count">0 / 3</span><button class="clear" id="clear">🔄 清除進度</button></section><button class="hotspot dynasty" data-key="cert_dynasty" aria-label="前往時光方塊城：朝代配對"></button><button class="hotspot idiom" data-key="cert_idiom" aria-label="前往成語魔法書庫：成語填字"></button><button class="hotspot warrior" data-key="cert_warrior" aria-label="前往勇者像素堡壘：打怪 RPG"></button><button class="hotspot gate-hotspot" aria-label="開啟三印封印大門"></button></div></main>
<div class="modal" id="modal" role="dialog" aria-modal="true"><section class="dialog" id="dialog"></section></div>
<script>
const C=[['cert_dynasty','dynasty','朝代','🎴 朝代之印'],['cert_idiom','idiom','成語','📝 成語之印'],['cert_warrior','warrior','勇者','⚔️ 勇者之印']];let put=new Set(),drag=null;const own=()=>C.filter(x=>localStorage.getItem(x[0])==='true');function update(){count.textContent=`${own().length} / 3`;document.querySelectorAll('.hotspot[data-key]').forEach(b=>b.classList.toggle('done',localStorage.getItem(b.dataset.key)==='true'))}function showMap(){cover.classList.add('hide');app.classList.add('show');sessionStorage.setItem('adventure_cover_seen','true');if(!localStorage.getItem('adventure_start'))localStorage.setItem('adventure_start',Date.now());update()}function openGate(){put=new Set;draw();modal.classList.add('show')}
function draw(){let have=own();dialog.innerHTML=`<button class="close" aria-label="關閉">×</button><h2>🔒 三印封印大門</h2><p style="text-align:center;font-weight:700">把背包裡的憑證拖到正確凹槽。</p><div class="slots">${C.map(c=>`<div class="slot ${put.has(c[1])?'correct':''}" data-slot="${c[1]}"><small>${c[2]}凹槽</small>${put.has(c[1])?`<span class="badge">${c[3]}</span>`:'放入憑證'}</div>`).join('')}</div><section class="bag"><h3>🎒 背包欄</h3><div class="badges">${have.filter(c=>!put.has(c[1])).map(c=>`<div class="badge" draggable="true" data-slot="${c[1]}">${c[3]}</div>`).join('')||'目前沒有可放入的憑證'}</div></section>`;dialog.querySelector('.close').onclick=()=>modal.classList.remove('show');dialog.querySelectorAll('.badge[draggable]').forEach(b=>{b.ondragstart=e=>{drag=b.dataset.slot;e.dataTransfer.setData('text',drag)};b.onpointerdown=e=>{drag=b.dataset.slot;b.setPointerCapture?.(e.pointerId)};b.onpointerup=e=>dropAt(drag,e.clientX,e.clientY)});dialog.querySelectorAll('.slot').forEach(s=>{s.ondragover=e=>{e.preventDefault();s.classList.add('over')};s.ondragleave=()=>s.classList.remove('over');s.ondrop=e=>{e.preventDefault();s.classList.remove('over');drop(e.dataTransfer.getData('text'),s)}})}function dropAt(a,x,y){let s=document.elementFromPoint(x,y)?.closest('.slot');if(s)drop(a,s)}function drop(a,s){if(!a)return;if(a===s.dataset.slot){put.add(a);put.size===3?finish():draw()}else{s.classList.add('wrong');setTimeout(()=>s.classList.remove('wrong'),450)}}
function finish(){let seconds=Math.max(0,Math.floor((Date.now()-(+localStorage.getItem('adventure_start')||Date.now()))/1000)),time=`${String(Math.floor(seconds/60)).padStart(2,'0')} 分 ${String(seconds%60).padStart(2,'0')} 秒`;dialog.innerHTML=`<section class="complete"><h2>🏆 冒險完成！</h2><p>總冒險時長：${time}</p><button class="again" id="again">再次冒險</button></section>`;again.onclick=restart}function clearProgress(){['cert_dynasty','cert_idiom','cert_warrior','adventure_start'].forEach(k=>localStorage.removeItem(k));update()}function restart(){clearProgress();sessionStorage.clear();modal.classList.remove('show');cover.classList.remove('hide');app.classList.remove('show')}cover.onclick=showMap;document.querySelector('.dynasty').onclick=()=>location.href='../示範1_朝代配對/index.html';document.querySelector('.idiom').onclick=()=>location.href='../示範2_成語填字/index.html';document.querySelector('.warrior').onclick=()=>location.href='../示範3_打怪RPG/index.html';document.querySelector('.gate-hotspot').onclick=openGate;clear.onclick=()=>{if(confirm('要清除所有闖關進度嗎？'))clearProgress()};modal.onclick=e=>e.target===modal&&modal.classList.remove('show');if(sessionStorage.getItem('adventure_cover_seen'))showMap();
</script></body></html>
